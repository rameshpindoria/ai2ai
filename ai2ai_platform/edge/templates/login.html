{% extends "base.html" %}
{% block content %}
<section class="card narrow" id="login-page">
  <h1>Sign in with your passkey</h1>
  <p class="muted">Use your fingerprint, face or device PIN. There are no passwords on this edge.</p>
  <button class="primary" id="passkey-login">Sign in with passkey</button>
  <p class="error" id="form-error" role="alert"></p>
  <p class="muted">First time? Open the enrolment link your administrator gave you.</p>
</section>
{% endblock %}
